# Variante de web/nginx.conf para Render: la API no es "api:3000" sino un servicio público con HTTPS.
# __API_HOST__ (por ejemplo demo-cicd-api.onrender.com) lo reemplaza el workflow con la variable RENDER_API_HOST.
# Si cambias web/nginx.conf (por ejemplo las cabeceras del Reto 1), refleja aquí el cambio.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://__API_HOST__;
        proxy_ssl_server_name on;
        proxy_set_header Host __API_HOST__;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;   # la API gratuita puede estar dormida: el primer request tarda
    }

    location /metrics {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}