# Prometheus mira SOLO el namespace demo-staging y recoge los pods con la anotación prometheus.io/scrape: "true"
# (el Deployment de la API ya la trae). Permisos mínimos: un Role en demo-staging, no un ClusterRole.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: observabilidad
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-descubre-pods
  namespace: demo-staging
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-descubre-pods
  namespace: demo-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus-descubre-pods
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: observabilidad
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observabilidad
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: api-staging
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [demo-staging]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
  alerts.yml: |
    groups:
      - name: libro-de-visitas
        rules:
          - alert: TasaDeErrores5xxAlta
            # Más del 5 % de las respuestas de la API son 5xx, sostenido durante un minuto.
            expr: |
              sum(rate(http_request_duration_seconds_count{status=~"5.."}[1m]))
                / sum(rate(http_request_duration_seconds_count[1m])) > 0.05
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "La API de STAGING devuelve más del 5 % de errores 5xx"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observabilidad
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=2d
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observabilidad
spec:
  type: NodePort
  selector: { app: prometheus }
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090   # http://localhost:30090 en Rancher Desktop